server.port=8089
spring.application.name=SERVICE-VOITURE
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}
spring.datasource.url=jdbc:h2:mem:voituredb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.cloud.openfeign.client.config.SERVICE-CLIENT.connectTimeout=3000
spring.cloud.openfeign.client.config.SERVICE-CLIENT.readTimeout=5000
